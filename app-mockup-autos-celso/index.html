<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon: burnice_logo.png debe estar en /public/burnice_logo.png
      Los archivos en /public se sirven desde la raíz "/" en Vite (dev y build).
    -->
    <link rel="icon" type="image/png" href="/burnice_logo.png" />
    <link rel="apple-touch-icon" href="/burnice_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Predicción de precios de vehículos usados mediante Machine Learning" />
    <title>Predicción de Precios — Vehículos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      /**
       * Aplica forma circular al favicon usando Canvas.
       * La imagen burnice_logo.png es cuadrada — este script la recorta en círculo.
       */
      (function applyRoundFavicon() {
        const img = new Image();
        img.src = '/burnice_logo.png';
        img.onload = function () {
          const size = 64;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(img, 0, 0, size, size);
          const link = document.querySelector("link[rel='icon']");
          if (link) {
            link.type = 'image/png';
            link.href = canvas.toDataURL('image/png');
          }
        };
      })();
    </script>
  </body>
</html>
